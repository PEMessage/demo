<!doctype html>
<html>
  <body>
    <h1>Hello Electron (ESM)</h1>
    <button onclick="alert('clicked')">Click Me</button>

    <p>page sees <code>process</code>: <code id="page-process"></code></p>
    <p>preload saw Electron: <code id="preload-version"></code></p>

    <p>
      <button onclick="showNative()">Ask native</button>
      <code id="native-info"></code>
    </p>

    <p>
      <button onclick="window.native.sayHi('hello from the page')">Say hi to main</button>
      <button onclick="window.native.quit()">Quit</button>
    </p>

    <p>
      <button onclick="askMain()">Ask main (userData)</button>
      <code id="main-info"></code>
    </p>

    <p>
      <button onclick="subscribe()">Subscribe to main ticks</button>
      <button onclick="unsubscribe()">Stop</button>
      ticks: <code id="tick"></code>
    </p>

    <p>
      <button onclick="window.native.openWindow()">Open window</button>
    </p>

    <script>
      document.getElementById('page-process').textContent = typeof process;

      function showNative() {
        const { electron, node } = window.native.getInfo();
        document.getElementById('native-info').textContent =
          `electron ${electron}, node ${node}`;
      }

      async function askMain() {
        const userData = await window.native.getUserData();
        document.getElementById('main-info').textContent = userData;
      }

      let stopTicks = null;

      function subscribe() {
        if (stopTicks) return;
        stopTicks = window.native.onTick((n) => {
          document.getElementById('tick').textContent = n;
        });
      }

      function unsubscribe() {
        if (!stopTicks) return;
        stopTicks();
        stopTicks = null;
      }
    </script>
  </body>
</html>
